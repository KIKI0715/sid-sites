<!DOCTYPE html>
<html lang="ko">
<head>
<!-- 실습 허브 미리보기용 사본. 원본: claude.ai 아티팩트. 받은 날: 2026-11-23 -->
<meta name="robots" content="noindex">

<title>Liftoff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@400;500&family=Noto+Sans+KR:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root{
    --bg:#0B0B0D; --fg:#ECECEC; --accent:#E1251B;
    --serif:"Cormorant Garamond", "Times New Roman", serif;
    --sans:"Inter", "Pretendard Variable", Pretendard, system-ui, sans-serif;
    --ko:"Pretendard Variable", Pretendard, "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --glass-fill:rgba(255,255,255,.06);
    --glass-line:rgba(255,255,255,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--fg)}
  body{font-family:var(--ko);font-size:15px;font-weight:400;line-height:1.8;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  /* 유리 뒤의 빛 번짐 */
  .glow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .glow i{position:absolute;border-radius:50%;filter:blur(110px);opacity:.55}
  .glow .r{width:46vw;height:46vw;left:-12vw;top:30vh;background:rgba(225,37,27,.32)}
  .glow .b{width:52vw;height:52vw;right:-16vw;top:-14vh;background:rgba(110,130,160,.30)}

  /* 유리 */
  .glass{
    background:var(--glass-fill);
    -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
    border:1px solid var(--glass-line);border-radius:16px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14);
  }

  /* 메뉴 */
  .nav{
    position:fixed;z-index:20;top:20px;left:50%;transform:translateX(-50%);
    width:min(1120px, calc(100% - 32px));
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 24px;
  }
  .brand,.menu a{font-family:var(--sans);font-size:11px;letter-spacing:.24em;text-transform:uppercase}
  .brand{font-weight:500}
  .menu{display:flex;gap:32px}
  .menu a{position:relative;opacity:.6;transition:opacity .2s}
  .menu a:hover{opacity:1}
  .menu a[aria-current="page"]{opacity:1;color:var(--accent)}
  .menu a[aria-current="page"]::after{content:"";position:absolute;left:0;right:.24em;bottom:-6px;height:1px;background:var(--accent)}
  @media (max-width:520px){
    .nav{padding:12px 16px;top:12px;width:calc(100% - 24px)}
    .menu{gap:16px}
    .brand,.menu a{letter-spacing:.16em}
  }

  /* index 전용 */
  .intro{position:relative;z-index:1;width:min(1120px, calc(100% - 32px));margin:0 auto;
    min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;
    padding:140px 0 clamp(72px,10vh,120px)}
  .intro h1{font-family:var(--serif);font-weight:300;font-size:clamp(96px, 23vw, 340px);line-height:.88;letter-spacing:-.02em;margin-left:-.04em}
  .wheel-o{display:inline-block;width:.47em;height:.47em;margin:0 .015em;vertical-align:-.005em}
  .intro .rule{height:1px;background:rgba(236,236,236,.18);margin:clamp(24px,3vw,40px) 0 20px}
  .intro .sub{display:flex;justify-content:space-between;align-items:baseline;gap:24px;flex-wrap:wrap}
  .intro p{font-size:15px;color:rgba(236,236,236,.7)}
  .scroll{font-family:var(--sans);font-size:11px;letter-spacing:.28em;text-transform:uppercase;opacity:.5;animation:blink 2.4s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:.8}}

  .hero{position:relative;z-index:1;height:100vh;height:100svh;min-height:520px;overflow:hidden}
  #scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
  #clouds{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .title-wrap{
    position:absolute;left:0;right:0;top:22%;
    display:flex;justify-content:center;text-align:center;
    pointer-events:none;padding:0 16px;
  }
  .title-wrap h2{
    font-family:var(--serif);font-weight:300;white-space:nowrap;
    font-size:clamp(44px, 10vw, 150px);line-height:1;letter-spacing:-.01em;
    opacity:0;filter:blur(16px);
  }
  .replay{
    position:absolute;left:50%;bottom:44px;transform:translateX(-50%);
    font-family:var(--sans);font-size:11px;letter-spacing:.28em;text-transform:uppercase;white-space:nowrap;
    display:none;padding:10px 22px;opacity:0;transition:opacity .6s}
  .replay.show{display:block}
  .replay.on{opacity:1}

  @media (prefers-reduced-motion: reduce){
    .scroll{animation:none}
    .title-wrap h2{opacity:1;filter:none}
  }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }

<body>
  <div class="glow" aria-hidden="true"><i class="r"></i><i class="b"></i></div>

  <header class="nav glass">
    <a class="brand" href="index.html">Liftoff</a>
    <nav class="menu">
      <a href="index.html" aria-current="page">Index</a>
      <a href="detail.html">Flight</a>
      <a href="about.html">Note</a>
    </nav>
  </header>

  <main>
    <section class="intro">
      <h1 aria-label="Liftoff">Lift<svg class="wheel-o" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="50" fill="#ECECEC"/><circle cx="50" cy="50" r="31" fill="#0B0B0D"/><circle cx="50" cy="50" r="27" fill="none" stroke="#ECECEC" stroke-width="2.4"/><g stroke="#ECECEC" stroke-width="5" stroke-linecap="round"><line x1="50" y1="50" x2="50" y2="25"/><line x1="50" y1="50" x2="73.8" y2="42.3"/><line x1="50" y1="50" x2="64.7" y2="70.2"/><line x1="50" y1="50" x2="35.3" y2="70.2"/><line x1="50" y1="50" x2="26.2" y2="42.3"/></g><circle cx="50" cy="50" r="7" fill="#E1251B"/></svg>ff</h1>
      <div class="rule"></div>
      <div class="sub">
        <p>도로의 마지막 100m, 바퀴가 땅을 놓는 순간.</p>
        <span class="scroll" aria-hidden="true">Scroll</span>
      </div>
    </section>

    <section class="hero" id="hero">
      <canvas id="scene" aria-label="초원 위 도로에 서 있는 하늘을 나는 자동차. 화면을 내리면 출발한다"></canvas>
      <canvas id="clouds" aria-hidden="true"></canvas>
      <div class="title-wrap">
        <h2 id="title">Above the Road</h2>
      </div>
      <button class="replay glass" id="replay" type="button">Replay</button>
    </section>
  </main>

<script type="module">
import * as THREE from 'three';

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const hero = document.getElementById('hero');
const canvas = document.getElementById('scene');
const cloudCv = document.getElementById('clouds');
const cctx = cloudCv.getContext('2d');
const titleEl = document.getElementById('title');
const replayBtn = document.getElementById('replay');

/* ---------- 렌더러와 장면 ---------- */
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const SKY = new THREE.Color('#06070d');
scene.background = SKY;
scene.fog = new THREE.FogExp2(SKY, 0.018);

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 900);

/* 빛: 아주 어둡게, 차에만 좁은 조명 */
scene.add(new THREE.HemisphereLight(0x3a4660, 0x0a120c, 0.35));
const moon = new THREE.DirectionalLight(0x8090b0, 0.25);
moon.position.set(-30, 40, 20);
scene.add(moon);

const spot = new THREE.SpotLight(0xffffff, 260, 40, Math.PI/10, 0.55, 1.6);
spot.position.set(0.3, 13, 1.2);
spot.castShadow = true;
spot.shadow.mapSize.set(1024,1024);
spot.shadow.bias = -0.0004;
scene.add(spot); scene.add(spot.target);
const rim = new THREE.DirectionalLight(0x9fb0d0, 0.9);
rim.position.set(-20, 12, -18); scene.add(rim);

/* ---------- 길: 직선 + 위로 휘는 램프 ---------- */
const RAMP_X = 72, R = 20, ARC = THREE.MathUtils.degToRad(72);
const ROAD_START = -60;
const STRAIGHT = RAMP_X - ROAD_START;            // 직선 길이
const ARC_LEN = R * ARC;
function pathAt(s){                                 // s: ROAD_START에서부터의 거리
  if (s <= STRAIGHT) return { p:new THREE.Vector3(ROAD_START + s, 0, 0), a:0 };
  const u = Math.min(s - STRAIGHT, ARC_LEN) / R;    // 호의 각도
  const p = new THREE.Vector3(RAMP_X + R*Math.sin(u), R - R*Math.cos(u), 0);
  if (s - STRAIGHT <= ARC_LEN) return { p, a:u };
  const extra = s - STRAIGHT - ARC_LEN;             // 램프 위로 조금 더 이어진 직선
  p.x += Math.cos(ARC)*extra; p.y += Math.sin(ARC)*extra;
  return { p, a:ARC };
}
const RAMP_TAIL = 6;
const ROAD_LEN = STRAIGHT + ARC_LEN + RAMP_TAIL;

function ribbon(z0, z1, lift, mat, step=0.5, dash=null){
  const pos = [], idx = [];
  let n = 0;
  for (let s = 0; s <= ROAD_LEN; s += step){
    if (dash && (Math.floor(s / dash[0]) % 2 === 1)) { n = -1; }
    const {p, a} = pathAt(s);
    const nx = -Math.sin(a), ny = Math.cos(a);       // 노면 법선
    pos.push(p.x + nx*lift, p.y + ny*lift, z0, p.x + nx*lift, p.y + ny*lift, z1);
    const i = pos.length/3 - 2;
    if (n > 0) idx.push(i-2, i-1, i, i-1, i+1, i);
    n = n < 0 ? 0 : n + 1;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return new THREE.Mesh(g, mat);
}
const roadMat = new THREE.MeshStandardMaterial({ color:0x3a3c40, roughness:0.92, side:THREE.DoubleSide });
const road = ribbon(-4.2, 4.2, 0.0, roadMat);
road.receiveShadow = true; scene.add(road);
const redMat = new THREE.MeshBasicMaterial({ color:0xff2a1f, side:THREE.DoubleSide });
scene.add(ribbon(-4.2, -3.95, 0.02, redMat));
scene.add(ribbon(3.95, 4.2, 0.02, redMat));
const dashMat = new THREE.MeshBasicMaterial({ color:0x9a9a9a, side:THREE.DoubleSide });
scene.add(ribbon(-0.08, 0.08, 0.015, dashMat, 0.25, [2.5]));

/* 빨간 선의 은은한 빛 */
[-4.1, 4.1].forEach(z=>{
  for (let x = -20; x <= RAMP_X; x += 23){
    const l = new THREE.PointLight(0xff2a1f, 3, 7, 2); l.position.set(x, 0.4, z); scene.add(l);
  }
});

/* 램프 받침 기둥 */
const postMat = new THREE.MeshStandardMaterial({ color:0x1a1b1f, roughness:0.8, metalness:0.3 });
for (let i = 1; i <= 7; i++){
  const {p} = pathAt(STRAIGHT + (ARC_LEN + RAMP_TAIL) * i/7.5);
  [-3.6, 3.6].forEach(z=>{
    const h = Math.max(p.y - 0.2, 0.3);
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.35, h, 0.35), postMat);
    m.position.set(p.x + 0.6, h/2, z); scene.add(m);
  });
}

/* 초원 */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 400),
  new THREE.MeshStandardMaterial({ color:0x18241b, roughness:1 }));
ground.rotation.x = -Math.PI/2; ground.position.y = -0.02; ground.receiveShadow = true;
scene.add(ground);

const bladeGeo = new THREE.ConeGeometry(0.035, 0.5, 3); bladeGeo.translate(0, 0.25, 0);
const bladeMat = new THREE.MeshStandardMaterial({ color:0x2c3d2e, roughness:1 });
const BLADES = 9000;
const grass = new THREE.InstancedMesh(bladeGeo, bladeMat, BLADES);
const dummy = new THREE.Object3D(); const col = new THREE.Color();
for (let i = 0; i < BLADES; i++){
  const side = Math.random() < 0.5 ? -1 : 1;
  const z = side < 0 ? -(4.6 + Math.pow(Math.random(), 1.6) * 34) : (16 + Math.random() * 24);
  const x = ROAD_START + Math.random() * (RAMP_X - ROAD_START + 30);
  dummy.position.set(x, 0, z);
  dummy.rotation.set((Math.random()-0.5)*0.5, Math.random()*Math.PI, (Math.random()-0.5)*0.5);
  const s = 0.6 + Math.random()*0.9; dummy.scale.set(s, s*(0.7+Math.random()*0.8), s);
  dummy.updateMatrix(); grass.setMatrixAt(i, dummy.matrix);
  col.setHSL(0.36 + Math.random()*0.04, 0.18 + Math.random()*0.12, 0.13 + Math.random()*0.1);
  grass.setColorAt(i, col);
}
grass.receiveShadow = true; scene.add(grass);

/* 별 */
{
  const g = new THREE.BufferGeometry(); const a = [];
  for (let i = 0; i < 900; i++){
    const th = Math.random()*Math.PI*2, ph = Math.random()*Math.PI*0.42;
    const r = 420;
    a.push(r*Math.sin(ph)*Math.cos(th) + 60, r*Math.cos(ph)*0.9 + 20, r*Math.sin(ph)*Math.sin(th));
  }
  g.setAttribute('position', new THREE.Float32BufferAttribute(a, 3));
  const stars = new THREE.Points(g, new THREE.PointsMaterial({ color:0xbfc8ff, size:1.1, sizeAttenuation:false, transparent:true, opacity:0.55, fog:false }));
  scene.add(stars);
}

/* ---------- 자동차 (코드로 만든 모형, 길이 4.5 · 높이 1.2) ---------- */
const car = new THREE.Group(); scene.add(car);
const body = new THREE.Group(); car.add(body);
const WR = 0.36, WX = 1.42, WZ = 0.86;

const bodyShape = new THREE.Shape();
bodyShape.moveTo(-2.25, 0.38);
bodyShape.lineTo(-WX - 0.47, 0.34);
bodyShape.absarc(-WX, WR, 0.47, Math.PI, 0, true);
bodyShape.lineTo(WX - 0.47, 0.34);
bodyShape.absarc(WX, WR, 0.47, Math.PI, 0, true);
bodyShape.lineTo(2.2, 0.36);
bodyShape.quadraticCurveTo(2.3, 0.42, 2.25, 0.52);
bodyShape.lineTo(0.95, 0.83);
bodyShape.lineTo(-2.0, 0.93);
bodyShape.quadraticCurveTo(-2.22, 0.92, -2.25, 0.84);
bodyShape.lineTo(-2.25, 0.38);
const bevel = { depth:1.66, bevelEnabled:true, bevelThickness:0.14, bevelSize:0.1, bevelSegments:5, curveSegments:24 };
const bodyGeo = new THREE.ExtrudeGeometry(bodyShape, bevel); bodyGeo.translate(0, 0, -0.83);
const paint = new THREE.MeshPhysicalMaterial({ color:0x8c9096, roughness:0.48, metalness:0.65, clearcoat:0.25, clearcoatRoughness:0.6 });
const bodyMesh = new THREE.Mesh(bodyGeo, paint); bodyMesh.castShadow = true; body.add(bodyMesh);

const cabShape = new THREE.Shape();
cabShape.moveTo(0.98, 0.8);
cabShape.quadraticCurveTo(0.2, 1.12, -0.35, 1.19);
cabShape.quadraticCurveTo(-1.1, 1.2, -2.0, 0.9);
cabShape.lineTo(0.98, 0.8);
const cabGeo = new THREE.ExtrudeGeometry(cabShape, { depth:1.3, bevelEnabled:true, bevelThickness:0.12, bevelSize:0.06, bevelSegments:5, curveSegments:24 });
cabGeo.translate(0, 0, -0.65);
const glass = new THREE.MeshPhysicalMaterial({ color:0x0c0e12, roughness:0.08, metalness:0.9, clearcoat:1 });
const cab = new THREE.Mesh(cabGeo, glass); cab.castShadow = true; body.add(cab);

/* 뒤를 가로지르는 빨간 불빛 줄, 앞의 가는 흰 불빛 */
const tail = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.045, 1.86), new THREE.MeshBasicMaterial({ color:0xff1e14 }));
tail.position.set(-2.37, 0.8, 0); body.add(tail);
const tailGlow = new THREE.PointLight(0xff2a1f, 6, 4, 2); tailGlow.position.set(-2.6, 0.8, 0); body.add(tailGlow);
const head = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, 1.6), new THREE.MeshBasicMaterial({ color:0xf4f4ff }));
head.position.set(2.31, 0.55, 0); head.rotation.z = -0.24; body.add(head);
const under = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.12, 1.7), new THREE.MeshStandardMaterial({ color:0x0b0b0c, roughness:1 }));
under.position.y = 0.36; body.add(under);

/* 바퀴: 스포크가 보여야 구르는 게 보인다 */
const tireMat = new THREE.MeshStandardMaterial({ color:0x111214, roughness:0.85 });
const rimMat  = new THREE.MeshStandardMaterial({ color:0xb9bec5, roughness:0.35, metalness:0.9 });
const hubMat  = new THREE.MeshStandardMaterial({ color:0x2a2c30, roughness:0.5, metalness:0.6 });
const wheels = [];
function makeWheel(){
  const w = new THREE.Group();
  const t = new THREE.Mesh(new THREE.TorusGeometry(WR - 0.07, 0.085, 16, 40), tireMat);
  t.scale.z = 1.6; w.add(t);
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(WR - 0.1, WR - 0.1, 0.26, 32, 1, true), hubMat);
  barrel.rotation.x = Math.PI/2; w.add(barrel);
  const disc = new THREE.Mesh(new THREE.CircleGeometry(WR - 0.1, 32), hubMat); disc.position.z = 0.1; w.add(disc);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(WR - 0.1, 0.016, 8, 40), rimMat); ring.position.z = 0.12; w.add(ring);
  for (let i = 0; i < 5; i++){
    const sp = new THREE.Mesh(new THREE.BoxGeometry(0.05, WR - 0.12, 0.03), rimMat);
    sp.geometry.translate(0, (WR - 0.12)/2, 0);
    sp.rotation.z = i * Math.PI*2/5; sp.position.z = 0.125; w.add(sp);
  }
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.03, 16), rimMat);
  cap.rotation.x = Math.PI/2; cap.position.z = 0.135; w.add(cap);
  w.traverse(o=>{ if (o.isMesh) o.castShadow = true; });
  return w;
}
[[ WX, WZ],[ WX,-WZ],[-WX, WZ],[-WX,-WZ]].forEach(([x,z])=>{
  const w = makeWheel(); w.position.set(x, WR, z);
  if (z < 0) w.rotation.y = Math.PI;
  car.add(w); wheels.push(w);
});
const REAR_WHEEL = wheels[2];

/* 바람선 12개 */
const streakMat = new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0, depthWrite:false, blending:THREE.AdditiveBlending, fog:false });
const streaks = [];
for (let i = 0; i < 12; i++){
  const g = new THREE.PlaneGeometry(1, 0.022); g.translate(-0.5, 0, 0);
  const m = new THREE.Mesh(g, streakMat.clone());
  m.userData = { y: 0.25 + Math.random()*0.95, z: (Math.random()-0.5)*2.2, off: Math.random()*0.8, len: 0.6 + Math.random()*0.8 };
  car.add(m); streaks.push(m);
}

/* 떠오른 뒤 남는 빨간 불빛 점 */
const dotCv = document.createElement('canvas'); dotCv.width = dotCv.height = 64;
{ const g = dotCv.getContext('2d'); const gr = g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,60,50,1)'); gr.addColorStop(0.3,'rgba(255,40,30,.6)'); gr.addColorStop(1,'rgba(255,30,20,0)');
  g.fillStyle = gr; g.fillRect(0,0,64,64); }
const redDot = new THREE.Sprite(new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(dotCv), transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, fog:false }));
redDot.scale.set(1.6, 1.6, 1); redDot.visible = false; scene.add(redDot);

/* ---------- 크기와 카메라 배치 ---------- */
let W = 1, H = 1, portrait = false;
function resize(){
  W = hero.clientWidth; H = hero.clientHeight;
  renderer.setSize(W, H, false);
  camera.aspect = W/H; portrait = camera.aspect < 0.9;
  camera.fov = portrait ? 52 : 40;
  camera.updateProjectionMatrix();
  const d = Math.min(devicePixelRatio, 2);
  cloudCv.width = W*d; cloudCv.height = H*d; cctx.setTransform(d,0,0,d,0,0);
}
addEventListener('resize', ()=>{ resize(); if (!running) renderOnce(); });

/* ---------- 타임라인 ---------- */
const T_CLOSE = 0.8, T_ACC_END = 1.8, T_PULL = 1.2, MAXV = 40, FLY_V = 46;
let running = false, done = false, last = 0, tv = 0;
let s = 0, v = 0, level = 0, launchT = -1, flyS = 0;
const START_S = 0 - ROAD_START;   // 차는 x = 0에서 출발
const launchP = pathAt(ROAD_LEN).p.clone();
const launchDir = new THREE.Vector3(Math.cos(ARC), Math.sin(ARC), 0);

const ease = x => x<.5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2;
const easeOut = x => 1 - Math.pow(1-x, 3);
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3(), tmpC = new THREE.Vector3(), tmpD = new THREE.Vector3();

function placeCar(){
  if (launchT < 0){
    const {p, a} = pathAt(s);
    car.position.copy(p); car.rotation.set(0, 0, a);
  } else {
    // 램프 끝에서 떠올라 위로, 그리고 멀리(-z)로
    const f = flyS;
    car.position.copy(launchP).addScaledVector(launchDir, f);
    car.position.z = -f * 1.35;
    car.position.x += f * 0.15;
    car.rotation.set(0, 0, ARC - Math.min(f/80, 1) * 0.5);
  }
}
function viewIdle(out, look){
  const k = portrait ? 2.0 : 1;
  out.set(car.position.x + 4.3*k, 1.05 + 0.5*(k-1), 5.4*k);
  look.set(car.position.x - 0.1, 0.55, 0);
}
function viewWheel(out, look){
  REAR_WHEEL.getWorldPosition(look);
  out.set(look.x + 0.55, look.y + 0.18, look.z + (portrait ? 2.6 : 2.05));
}
function viewSide(out, look){
  const k = portrait ? 1.9 : 1;
  out.set(car.position.x - 1.4, car.position.y + 1.5, car.position.z + 11*k);
  look.set(car.position.x + 1.4, car.position.y + 0.7, car.position.z);
}
function viewSky(out, look){
  const k = portrait ? 1.35 : 1;
  out.set(RAMP_X - 26*k, 3.2, 44*k);
  look.set(RAMP_X + 4, 30, -10);
}
function mixView(a, b, f){
  a(tmpA, tmpB); b(tmpC, tmpD);
  camPos.lerpVectors(tmpA, tmpC, f); camLook.lerpVectors(tmpB, tmpD, f);
}

let skyFrom = null;
function updateCamera(t){
  const pullStart = T_ACC_END, pullEnd = T_ACC_END + T_PULL;
  if (!running && !done){ viewIdle(camPos, camLook); }
  else if (t < T_CLOSE){ mixView(viewIdle, viewWheel, ease(t/T_CLOSE)); }
  else if (t < pullStart){ viewWheel(camPos, camLook); }
  else if (t < pullEnd){ mixView(viewWheel, viewSide, ease((t-pullStart)/T_PULL)); }
  else if (s < STRAIGHT - 18 && launchT < 0){ viewSide(camPos, camLook); }
  else {
    if (!skyFrom){ skyFrom = { t, p:new THREE.Vector3(), l:new THREE.Vector3() }; viewSide(skyFrom.p, skyFrom.l); }
    const f = ease(Math.min((t - skyFrom.t)/1.1, 1));
    viewSky(tmpC, tmpD);
    camPos.lerpVectors(skyFrom.p, tmpC, f); camLook.lerpVectors(skyFrom.l, tmpD, f);
  }
  camera.position.copy(camPos); camera.lookAt(camLook);
}

function updateStreaks(t, dt){
  const spd = launchT >= 0 ? 1 : v / MAXV;
  const count = launchT >= 0 ? 12 : Math.round(level * 1.2);
  streaks.forEach((m, i)=>{
    const u = m.userData;
    const on = i < count;
    const target = on ? (0.35 + 0.45*spd) * (0.6 + 0.4*Math.sin(t*9 + u.off*10)) : 0;
    m.material.opacity += (target - m.material.opacity) * Math.min(dt*10, 1);
    m.visible = m.material.opacity > 0.01;
    m.scale.x = (1.2 + spd * 7) * u.len;
    m.position.set(-2.35 - u.off * (1 + spd*2), u.y, u.z);
  });
}

/* ---------- 구름 입자: 비행운이 글자로 모인다 ---------- */
let puffImg;
{
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  const gr = g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,.9)'); gr.addColorStop(0.45,'rgba(255,255,255,.35)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0,0,64,64); puffImg = c;
}
let parts = [], targets = [], emitIdx = 0, gatherT = -1, solidT = -1;
const EMIT = 1.2, GATHER = 2.5, SOLID = 0.7, HOLD = 0.5, FOCUS = 1.3;

function sampleTitle(){
  const r = titleEl.getBoundingClientRect(), hr = hero.getBoundingClientRect();
  const cs = getComputedStyle(titleEl);
  const c = document.createElement('canvas');
  c.width = Math.ceil(r.width); c.height = Math.ceil(r.height);
  const g = c.getContext('2d');
  g.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
  g.fillText(titleEl.textContent, c.width/2, c.height/2 + parseFloat(cs.fontSize)*0.04);
  const data = g.getImageData(0,0,c.width,c.height).data;
  const fs = parseFloat(cs.fontSize);
  let step = Math.max(2, Math.round(fs / 46));
  let pts;
  for (;;){
    pts = [];
    for (let y = 0; y < c.height; y += step)
      for (let x = 0; x < c.width; x += step)
        if (data[(y*c.width + x)*4 + 3] > 120) pts.push([r.left - hr.left + x, r.top - hr.top + y]);
    if (pts.length <= 2600) break; step++;
  }
  for (let i = pts.length - 1; i > 0; i--){ const j = (Math.random()*(i+1))|0; [pts[i], pts[j]] = [pts[j], pts[i]]; }
  pts.sort((a,b)=>a[0]-b[0] + (Math.random()-0.5)*fs*0.8);
  return { pts, step };
}
const proj = new THREE.Vector3();
function carScreen(){
  tail.getWorldPosition(proj); proj.project(camera);
  return [ (proj.x*0.5 + 0.5) * W, (-proj.y*0.5 + 0.5) * H ];
}
let sampleStep = 3;
function emitParticles(t){
  const f = Math.min((t - launchT) / EMIT, 1);
  const want = Math.floor(f * targets.length);
  const [cx, cy] = carScreen();
  const [px, py] = prevScr || [cx, cy];
  const n0 = emitIdx, n = Math.max(want - n0, 1);
  while (emitIdx < want){
    const tg = targets[emitIdx];
    const k = (emitIdx - n0 + Math.random()) / n;
    const ex = px + (cx - px)*k, ey = py + (cy - py)*k;
    parts.push({ x:ex + (Math.random()-0.5)*8, y:ey + (Math.random()-0.5)*8,
      vx:(Math.random()-0.5)*26, vy:(Math.random()-0.5)*26 + 8,
      r:2, born:t, tx:tg[0], ty:tg[1], sx:0, sy:0,
      delay:Math.random()*0.45, wob:(Math.random()-0.5)*90 });
    emitIdx++;
  }
  prevScr = [cx, cy];
}
let prevScr = null;
function drawClouds(t, dt){
  cctx.clearRect(0,0,W,H);
  if (!parts.length) return;
  let fade = 1;
  if (solidT >= 0) fade = 1 - Math.min((t - solidT)/SOLID, 1);
  if (fade <= 0) return;
  for (const p of parts){
    let a = 0.55;
    if (gatherT < 0){
      const age = t - p.born;
      p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.985; p.vy *= 0.985;
      p.r = 3 + Math.min(age/1.1, 1) * 16;          // 부풀어 퍼진다
      a = 0.3 * Math.min(age/0.15, 1);
    } else {
      if (!p.sx){ p.sx = p.x; p.sy = p.y; p.sr = p.r; }
      const g = Math.max(0, Math.min((t - gatherT - p.delay) / (GATHER - 0.45), 1));
      const e = ease(g);
      const dx = p.tx - p.sx, dy = p.ty - p.sy;
      const bend = Math.sin(e*Math.PI) * p.wob;      // 흩어지며 휘어 모인다
      const len = Math.hypot(dx, dy) || 1;
      p.x = p.sx + dx*e + (-dy/len)*bend;
      p.y = p.sy + dy*e + ( dx/len)*bend;
      p.r = p.sr + (sampleStep*1.6 - p.sr) * e;
      a = 0.3 + 0.5*e;
    }
    const rr = p.r*2;
    cctx.globalAlpha = a * fade;
    cctx.drawImage(puffImg, p.x - p.r, p.y - p.r, rr, rr);
  }
  cctx.globalAlpha = 1;
}

/* ---------- 메인 루프 ---------- */
function frame(now){
  if (!running) return;
  const dt = Math.min((now - last)/1000, 0.05); last = now;
  tv += dt; const t = tv;

  // 속도: 클로즈업 뒤 0.1초마다 한 단계씩, 10단계
  if (t >= T_CLOSE) level = Math.min(10, Math.floor((t - T_CLOSE)/0.1) + 1);
  v = level * (MAXV/10);
  if (launchT < 0){
    s += v*dt;
    if (s >= ROAD_LEN){ launchT = t; flyS = s - ROAD_LEN; }
  } else {
    flyS += FLY_V*dt;
  }
  placeCar();
  const roll = v*dt / WR;
  wheels.forEach(w=>{ w.rotation.z += w.rotation.y ? roll : -roll; });
  spot.target.position.copy(car.position);
  spot.position.set(car.position.x + 0.3, car.position.y + 13, 1.2);
  spot.intensity = launchT < 0 ? 260 * Math.max(0, 1 - Math.max(0, t - 2.4)/1.5) : 0;

  updateStreaks(t, dt);
  updateCamera(t);

  // 이륙 뒤
  if (launchT >= 0){
    const ft = t - launchT;
    const fadeCar = Math.min(Math.max((ft - 1.0)/0.8, 0), 1);
    body.visible = fadeCar < 1; wheels.forEach(w=> w.visible = fadeCar < 1);
    streaks.forEach(m=> m.visible = m.visible && fadeCar < 1);
    redDot.visible = true;
    tail.getWorldPosition(redDot.position);
    if (fadeCar >= 1) redDot.position.copy(lastDot); else lastDot.copy(redDot.position);
    redDot.material.opacity = 1 - Math.min(Math.max((ft - 2.6)/1.4, 0), 1);
    redDot.scale.setScalar(1.6 + fadeCar*2.5);
    if (ft <= EMIT + 0.05) emitParticles(t);
    if (gatherT < 0 && ft >= EMIT) gatherT = t;
    if (gatherT >= 0 && solidT < 0 && t >= gatherT + GATHER) solidT = t;
    if (solidT >= 0){
      // 구름이 걷히며 흐린 글자가 남고, 잠깐 머문 뒤 초점이 맞는다
      const a = Math.min((t - solidT)/SOLID, 1);
      const f = Math.min(Math.max((t - solidT - SOLID - HOLD)/FOCUS, 0), 1);
      titleEl.style.opacity = a;
      titleEl.style.filter = `blur(${16*(1-ease(f))}px)`;
      if (f >= 1) finish();
    }
  }
  drawClouds(t, dt);
  renderer.render(scene, camera);
  if (running) requestAnimationFrame(frame);
}
const lastDot = new THREE.Vector3();

function finish(){
  running = false; done = true;
  cctx.clearRect(0,0,W,H);
  replayBtn.classList.add('show');
  requestAnimationFrame(()=> replayBtn.classList.add('on'));
}

async function start(){
  if (running || done || reduce) return;
  running = true;
  await document.fonts.ready;
  const smp = sampleTitle(); targets = smp.pts; sampleStep = smp.step;
  tv = 0; last = performance.now();
  requestAnimationFrame(frame);
}

function reset(){
  running = false; done = false;
  s = START_S; v = 0; level = 0; launchT = -1; flyS = 0; skyFrom = null;
  parts = []; emitIdx = 0; prevScr = null; gatherT = solidT = -1;
  body.visible = true; wheels.forEach(w=> w.visible = true); redDot.visible = false;
  streaks.forEach(m=>{ m.material.opacity = 0; m.visible = false; });
  titleEl.style.opacity = ''; titleEl.style.filter = '';
  replayBtn.classList.remove('show','on');
  spot.intensity = 260;
  placeCar(); spot.target.position.copy(car.position);
  spot.position.set(car.position.x + 0.3, 13, 1.2);
  cctx.clearRect(0,0,W,H);
  renderOnce();
}
function renderOnce(){ updateCamera(0); renderer.render(scene, camera); }

/* ---------- 입력: 화면을 내려 장면이 60% 이상 보이면 출발, 차를 눌러도 출발 ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
new IntersectionObserver(es=>{
  es.forEach(e=>{ if (e.isIntersecting && !running && !done) start(); });
}, { threshold:0.6 }).observe(hero);
canvas.addEventListener('click', e=>{
  if (running || done) return;
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left)/r.width)*2 - 1, -((e.clientY - r.top)/r.height)*2 + 1);
  ray.setFromCamera(ndc, camera);
  if (ray.intersectObject(car, true).length) start();
});
replayBtn.addEventListener('click', ()=>{ reset(); start(); });

resize();
reset();
window.__liftoff = { start, state:()=>({ running, done, tv, s, level, launchT }) };
</script>
