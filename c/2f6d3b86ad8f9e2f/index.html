<style>@font-face{font-family:'Pretendard';src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2-variations'),url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2');font-weight:45 920;font-style:normal;font-display:swap}</style>

<style>
  :root {
    --bg: #F6F7F2;
    --ink: #1F2A22;
    --green: #3F7D4E;
    --title: clamp(64px, 16vw, 240px);
    --head: calc(var(--title) / 3);
    --gutter: clamp(16px, 5vw, 80px);
    --numw: clamp(40px, 8vw, 128px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { overflow-x: clip; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Pretendard', sans-serif;
    font-size: 16px;
    font-weight: 400;
    line-height: 1.8;
    word-break: keep-all;
    overflow-wrap: break-word;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, p, ol, ul { margin: 0; padding: 0; }
  ol, ul { list-style: none; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 1px solid var(--green); outline-offset: 4px; }
  .sr {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
  }

  /* Menu */
  .site-header { padding: 28px var(--gutter); }
  .menu { display: flex; gap: clamp(20px, 3vw, 40px); }
  .menu a {
    font-size: 13px;
    letter-spacing: 0.04em;
    line-height: 1.4;
    padding: 6px 0;
    display: inline-block;
  }
  .menu a[aria-current="page"] { font-weight: 600; color: var(--green); }

  /* Type */
  .site-title {
    font-size: var(--title);
    font-weight: 700;
    line-height: 0.9;
    letter-spacing: -0.04em;
    white-space: nowrap;
  }
  .page-title, .sub {
    font-size: var(--head);
    font-weight: 600;
    line-height: 1.15;
    letter-spacing: -0.02em;
  }
  .num { font-size: 13px; letter-spacing: 0.04em; line-height: 1.4; }
  .text { max-width: 34em; }

  main { padding: 0 var(--gutter); }
  .page { padding-top: clamp(56px, 10vw, 160px); padding-bottom: clamp(96px, 14vw, 200px); }
  .page-title { margin-bottom: clamp(48px, 8vw, 128px); }

  /* Index */
  .hero {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: flex-end;
    padding-bottom: clamp(32px, 6vw, 80px);
  }
  .intro { padding: 28vh 0 40vh; }
  .lead { max-width: 12em; }
  .lead .w { white-space: nowrap; }
  .js .lead .c {
    display: inline-block;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.2, 0.7, 0.2, 1);
    transition-delay: calc(var(--i) * 0.04s);
  }
  .js .lead.in .c { opacity: 1; transform: none; }

  /* Choose */
  .steps { border-bottom: 1px solid var(--ink); }
  .step { border-top: 1px solid var(--ink); }
  .step-btn {
    width: 100%;
    display: grid;
    grid-template-columns: var(--numw) minmax(0, 1fr) auto;
    align-items: center;
    padding: clamp(20px, 3vw, 40px) 0;
    text-align: left;
  }
  .step-btn .sub { font-size: var(--head); }
  .plus {
    position: relative;
    width: clamp(20px, 2.4vw, 32px);
    height: clamp(20px, 2.4vw, 32px);
    transition: transform 0.4s ease;
  }
  .plus::before, .plus::after {
    content: "";
    position: absolute;
    background: var(--ink);
  }
  .plus::before { left: 0; right: 0; top: 50%; height: 1px; }
  .plus::after { top: 0; bottom: 0; left: 50%; width: 1px; }
  .step-btn[aria-expanded="true"] .plus { transform: rotate(45deg); }
  .panel {
    display: grid;
    grid-template-rows: 0fr;
    visibility: hidden;
    transition: grid-template-rows 0.4s ease, visibility 0s linear 0.4s;
  }
  .panel.open {
    grid-template-rows: 1fr;
    visibility: visible;
    transition: grid-template-rows 0.4s ease, visibility 0s;
  }
  .panel-in { overflow: hidden; min-height: 0; }
  .panel p { padding: 0 0 clamp(32px, 4vw, 56px) var(--numw); }

  /* Care */
  .carousel {
    max-width: 1040px;
    display: grid;
    grid-template-columns: 48px minmax(0, 1fr) 48px;
    grid-template-areas: "prev view next" ". dots .";
    column-gap: clamp(16px, 3vw, 40px);
    row-gap: 32px;
    align-items: center;
  }
  .viewport {
    grid-area: view;
    overflow: hidden;
    touch-action: pan-y;
    user-select: none;
    -webkit-user-select: none;
  }
  .track {
    display: flex;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .card {
    flex: 0 0 100%;
    min-width: 0;
    border: 1px solid var(--ink);
    padding: clamp(28px, 5vw, 64px);
  }
  .icon {
    display: block;
    width: 56px;
    height: 56px;
    margin-bottom: clamp(32px, 5vw, 64px);
    overflow: visible;
    fill: none;
    stroke: var(--green);
    stroke-width: 1;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .icon * { vector-effect: non-scaling-stroke; }
  .icon .move { transform-box: view-box; }
  .icon .drop { transform-origin: 12px 12px; }
  .icon .sun { transform-origin: 12px 12px; }
  .icon .leaf { transform-origin: 5px 19px; }
  .card .num { display: block; margin-bottom: 8px; }
  .card .sub { margin-bottom: clamp(20px, 3vw, 32px); }
  .play .drop { animation: drop 0.8s cubic-bezier(0.5, 0, 0.75, 0) 0.2s both; }
  .play .sun { animation: spin 2.4s ease-in-out 0.2s both; }
  .play .leaf { animation: sway 1.8s ease-in-out 0.2s both; }
  @keyframes drop {
    0% { transform: translateY(-14px); opacity: 0; }
    20% { opacity: 1; }
    70% { transform: translateY(0); animation-timing-function: ease-out; }
    84% { transform: translateY(-1.5px); animation-timing-function: ease-in; }
    100% { transform: translateY(0); opacity: 1; }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes sway {
    0% { transform: rotate(0deg); }
    20% { transform: rotate(9deg); }
    45% { transform: rotate(-7deg); }
    70% { transform: rotate(4deg); }
    88% { transform: rotate(-2deg); }
    100% { transform: rotate(0deg); }
  }
  .arrow {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
  }
  .arrow svg {
    width: 24px; height: 24px;
    fill: none; stroke: var(--ink); stroke-width: 1;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .arrow:disabled { cursor: default; opacity: 0.25; }
  .prev { grid-area: prev; }
  .next { grid-area: next; }
  .dots { grid-area: dots; display: flex; justify-content: center; gap: 12px; }
  .dot {
    width: 8px; height: 8px;
    border: 1px solid var(--ink);
    border-radius: 50%;
  }
  .dot.on { background: var(--green); border-color: var(--green); }

  @media (max-width: 600px) {
    .carousel {
      grid-template-columns: 48px minmax(0, 1fr) 48px;
      grid-template-areas: "view view view" "prev dots next";
      row-gap: 16px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition: none !important;
      animation: none !important;
    }
    .js .lead .c { opacity: 1; transform: none; }
  }
</style>
<style>
  /* Plant drawings */
  .plant { display: block; overflow: visible; }
  .plant * { vector-effect: non-scaling-stroke; }
  .plant .lf { fill: var(--green); fill-opacity: 0.2; stroke: var(--green); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .plant .vein, .plant .stem { fill: none; stroke: var(--green); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .plant .pot { fill: var(--bg); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
  .plant .soil { fill: var(--ink); fill-opacity: 0.12; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
  .plant .tool { fill: var(--bg); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .plant .tool-line { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .plant .drop, .plant .ripple, .plant .wind { opacity: 0; }
  .plant .ripple { fill: none; stroke: var(--green); stroke-width: 2; }
  .plant .wind { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
  .scene-water .soil { fill-opacity: 0.34; }
  .scene-light .tilt .lf { fill-opacity: 0.32; }

  /* Index: 햇빛 드는 창가 */
  :root { --sun: #F4D98A; }
  body:has(.hero) main { overflow-x: clip; } /* 화면 밖으로 이어지는 선반이 가로 스크롤을 만들지 않게 */
  body:has(.hero) .site-header { position: absolute; top: 0; left: 0; right: 0; z-index: 2; }
  .hero {
    position: relative;
    flex-direction: column;
    justify-content: space-between;
    align-items: stretch;
    gap: 24px;
    padding: 88px 0 0;
  }
  .hero .site-title { position: relative; z-index: 1; align-self: flex-start; }
  .lead { text-wrap: balance; }
  .ws {
    display: block;
    width: calc(100% + 2 * var(--gutter));
    max-width: 1440px; /* 1440 폭에서 보이던 크기보다 더 커지지 않는다 */
    margin: 0 calc(-1 * var(--gutter));
    align-self: flex-end; /* 오른쪽 화면 끝에 붙인다 */
    height: auto;
    aspect-ratio: 1440 / 900;
    overflow: visible; /* 선반만 화면 양끝까지 이어진다 */
  }
  .ws * { vector-effect: non-scaling-stroke; }
  .ws .ink { fill: var(--bg); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .ws .line { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .ws .glass { fill: var(--sun); fill-opacity: 0.3; }
  .ws .beams { fill: var(--sun); opacity: 0.28; animation: ws-breathe 6s ease-in-out infinite; }
  .ws .soil { fill: var(--ink); fill-opacity: 0.12; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
  .ws .stem, .ws .vein { fill: none; stroke: var(--green); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ws .g20, .ws .g35, .ws .g55, .ws .g80, .ws .g100 { fill: var(--green); stroke: var(--green); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .ws .g20 { fill-opacity: 0.2; }
  .ws .g35 { fill-opacity: 0.35; }
  .ws .g55 { fill-opacity: 0.55; }
  .ws .g80 { fill-opacity: 0.8; }
  .ws .g100 { fill-opacity: 1; }
  .ws .face { fill: var(--ink); }
  .ws .sway { transform-box: view-box; animation: ws-sway 3.5s ease-in-out infinite; }
  @keyframes ws-sway {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(3deg); }
    75% { transform: rotate(-3deg); }
  }
  @keyframes ws-breathe {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 0.35; }
  }
  @media (min-width: 601px) and (max-width: 999px) {
    .ws { aspect-ratio: 1020 / 860; }
  }
  @media (max-width: 600px) {
    .ws { aspect-ratio: 710 / 840; }
    .ws .p-sans, .ws .p-succ, .ws .p-hang { display: none; }
  }
  @media (min-width: 1200px) {
    /* 넓은 화면: 장면이 첫 화면을 채우고, 제목은 그 위 왼쪽 위에 얹는다 */
    /* 장면의 창문 윗변(장면 높이의 80/900)이 제목 아래 끝(y 꼬리 포함)보다 32px 아래에 오도록 장면을 내린다 */
    .hero {
      justify-content: flex-end;
      padding-top: calc(max(88px, 6.5vw) + 1.02 * var(--title) + 32px - min(100vw, 1440px) / 18);
    }
    .hero .site-title { position: absolute; top: max(88px, 6.5vw); left: 0; }
  }

  /* Care scenes */
  .scene-btn { display: block; width: 70%; margin: 0 auto clamp(28px, 4vw, 48px); touch-action: pan-y; }
  .scene { width: 100%; height: auto; overflow: hidden; }
</style>

  <section class="intro">
    <p class="lead sub" id="lead">
      <span class="sr">Find the plant that fits you best.</span>
      <span class="chars" aria-hidden="true">Find the plant that fits you best.</span>
    </p>
  </section>
</main>

<script>
(function () {
  var lead = document.getElementById('lead');
  var holder = lead.querySelector('.chars');
  var words = holder.textContent.trim().split(' ');
  var i = 0;
  holder.textContent = '';
  words.forEach(function (word, w) {
    if (w > 0) holder.appendChild(document.createTextNode(' '));
    var ws = document.createElement('span');
    ws.className = 'w';
    Array.from(word).forEach(function (ch) {
      var c = document.createElement('span');
      c.className = 'c';
      c.style.setProperty('--i', i++);
      c.textContent = ch;
      ws.appendChild(c);
    });
    holder.appendChild(ws);
  });

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || !('IntersectionObserver' in window)) {
    lead.classList.add('in');
    return;
  }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        lead.classList.add('in');
        io.disconnect();
      }
    });
  }, { threshold: 0.5 });
  io.observe(lead);
})();

// 화면 폭에 맞춰 장면을 자른다: 넓은 화면은 전체, 중간 폭은 식물 쪽, 좁은 화면(600px 이하)은 몬스테라·선인장·스킨답서스 쪽만
(function () {
  var ws = document.querySelector('.ws');
  var small = window.matchMedia('(max-width: 600px)');
  var mid = window.matchMedia('(min-width: 601px) and (max-width: 999px)');
  function frame() {
    ws.setAttribute('viewBox', small.matches ? '730 60 710 840' : mid.matches ? '420 40 1020 860' : '0 0 1440 900');
  }
  frame();
  [small, mid].forEach(function (mq) {
    if (mq.addEventListener) mq.addEventListener('change', frame); else mq.addListener(frame);
  });
})();
</script>
