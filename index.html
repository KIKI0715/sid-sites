<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>11/16 SID 실습 허브</title>
<meta name="description" content="스마트 인터랙션 디자인 수업에서 만들어 올린 웹사이트.">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 값은 모두 DESIGN.md에서 온다 */
  :root{
    --canvas:#ffffff; --surface:#f4f4f4; --hairline:#e0e0e0; --ink:#161616; --ink-hover:#393939; --ink-muted:#525252;
    --placeholder:#a8a8a8; --disabled:#c6c6c6; --accent:#da1e28; --danger:#da1e28;
    --font:"Helvetica Neue",Helvetica,Arial,"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:var(--font);font-size:15px;line-height:1.6;color:var(--ink);background:var(--canvas);
       -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
  a{color:inherit}
  .wrap{max-width:1440px;margin:0 auto;padding:0 32px}
  header{border-top:8px solid var(--ink);padding:24px 0 64px}
  h1{font-size:clamp(56px,10.5vw,160px);font-weight:700;line-height:.94;letter-spacing:-.04em;margin:0 0 0 -.04em}
  h1 .date{color:var(--accent)}
  .grid{list-style:none;margin:0;padding:0 0 96px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:64px 24px}
  .card a{display:block;text-decoration:none;border-top:1px solid var(--ink)}
  .idx{display:flex;justify-content:space-between;align-items:center;height:40px;font-size:13px;font-weight:700;line-height:1;
       font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .idx .tag{color:var(--accent)}
  .idx .host{color:var(--ink-muted)}
  .shot{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--surface);border:1px solid var(--hairline);transition:border-color .2s ease-out}
  .shot iframe{position:absolute;left:0;top:0;width:1280px;height:800px;border:0;transform-origin:0 0;pointer-events:none;background:var(--canvas);opacity:0;transition:opacity .2s ease-out}
  .shot iframe.on{opacity:1}
  .shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
  .shot .wait{position:absolute;left:12px;bottom:8px;font-size:13px;line-height:1.6;color:var(--ink-muted)}
  h2{font-size:24px;font-weight:700;line-height:1.2;letter-spacing:-.01em;margin:16px 0 0}
  .line{color:var(--ink-muted);font-size:15px;line-height:1.6;margin:4px 0 0}
  .card a:hover .shot,.card a:focus-visible .shot{border-color:var(--ink)}
  .card a:hover .idx,.card a:focus-visible .idx,.card a:hover .idx .host,.card a:focus-visible .idx .host{color:var(--accent)}
  .card a:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
  footer{border-top:1px solid var(--ink);padding:24px 0 96px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 24px;color:var(--ink-muted)}
  footer p{margin:0}
  [hidden]{display:none !important}
  .top{display:flex;justify-content:flex-end;min-height:16px;margin-bottom:8px}
  .text{font:inherit;font-size:13px;font-weight:700;line-height:1;letter-spacing:.02em;color:var(--ink);background:none;border:0;padding:0;cursor:pointer}
  .text:hover{text-decoration:underline;text-underline-offset:4px}
  .text:focus-visible,.gate button.go:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
  .gate{max-width:640px;padding:0 0 96px}
  .gate .field{margin-bottom:40px}
  .gate label.name{display:block;font-size:13px;font-weight:700;line-height:1.6;letter-spacing:.02em}
  .gate input.in{display:block;width:100%;font-family:var(--font);font-size:28px;font-weight:500;line-height:1.3;color:var(--ink);
        background:none;border:0;border-bottom:1px solid var(--hairline);border-radius:0;padding:12px 0;margin:0;
        box-shadow:0 1px 0 transparent;transition:border-color .2s ease-out,box-shadow .2s ease-out}
  .gate input.in:hover{border-bottom-color:var(--ink-muted)}
  .gate input.in:focus{outline:0;border-bottom-color:var(--ink);box-shadow:0 1px 0 var(--ink)}
  .gate .keep{display:flex;align-items:center;gap:8px;margin:0 0 24px}
  .gate .keep input{width:20px;height:20px;margin:0;accent-color:var(--ink)}
  .gate .msg{font-size:15px;line-height:1.6;margin:8px 0 0;min-height:24px;color:var(--danger)}
  .gate button.go{font-family:var(--font);font-size:17px;font-weight:700;line-height:1;color:var(--canvas);background:var(--ink);
            border:0;border-radius:0;height:56px;padding:0 32px;cursor:pointer;transition:background-color .2s ease-out}
  .gate button.go:hover{background:var(--ink-hover)}
  .gate button.go[disabled]{background:var(--disabled);cursor:default}
  .loading{display:none;margin:0;padding:0 0 96px;color:var(--ink-muted)}
  .entering .gate{display:none}
  .entering .loading{display:block}
  @media (max-width:1023px){
    .grid,footer{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:640px){
    .wrap{padding:0 16px}
    header{padding:16px 0 40px}
    .grid{grid-template-columns:minmax(0,1fr);gap:48px}
    footer{grid-template-columns:minmax(0,1fr);padding-bottom:64px}
    .gate{padding-bottom:64px}
    .gate input.in{font-size:24px}
    .gate button.go{width:100%}
  }
  @media (prefers-reduced-motion:reduce){
    .shot,.shot iframe{transition:none}
  }
</style>
<script>
/* 출입증이 남아 있으면 로그인 칸을 그리지 않고 "불러오는 중"부터 보여 줘요. 목록을 받거나 받지 못하면 아래 스크립트가 이 표시를 지워요 */
try{ if(sessionStorage.getItem('si-hub-token') || localStorage.getItem('si-hub-token')){ document.documentElement.classList.add('entering'); } }catch(e){}
</script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top"><button type="button" class="text" id="out" hidden>로그아웃</button></div>
    <h1><span class="date">11/16</span> SID<br>실습 허브</h1>
  </header>
  <main>
    <form class="gate" id="gate" autocomplete="on" novalidate>
      <div class="field">
        <label class="name" for="uid">아이디</label>
        <input class="in" id="uid" name="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required>
      </div>
      <div class="field">
        <label class="name" for="upw">비밀번호</label>
        <input class="in" id="upw" name="password" type="password" autocomplete="current-password" required>
      </div>
      <label class="keep"><input type="checkbox" id="keep"> 이 기기에서 30일 동안 로그인 유지</label>
      <button type="submit" class="go" id="gateOk">로그인</button>
      <p class="msg" id="gateMsg" role="alert"></p>
    </form>
    <p class="loading" role="status">불러오는 중이에요</p>
    <ul class="grid" id="grid" hidden></ul>
  </main>
  <footer id="foot" hidden>
    <p>미리보기는 지금 올라가 있는 사이트를 그대로 보여 줘요. 만든 사람이 고쳐서 다시 올리면 여기도 같이 바뀌어요. 그렇게 넣을 수 없는 주소는 받아 둔 사본으로 보여 줘요. 사본은 받은 날의 모습이에요.</p>
    <p>인터랙션은 미리보기에서 되지 않아요. 카드를 눌러 사이트에서 해 보세요.</p>
  </footer>
</div>
<script src="config.js?v=20261120a"></script>
<script>
(function(){
  /* 계정으로 들어온 사람만 봐요. 이 저장소에는 사이트 목록이 없어요.
     목록(별칭, 사이트 제목, 한 줄, 주소, 제출 시각)은 비공개 저장소(config.js 의 endpoint)가 로그인한 사람에게만 내려 줘요.
     페이지를 열어 둔 동안 1분마다 다시 읽어서, 달라진 카드만 바꿔요 */
  var CFG = window.HUB_CONFIG || {};
  /* 로컬에서 시험할 때만 ?api= 로 다른 저장소 주소를 쓸 수 있어요. 올라간 허브에서는 config.js 의 주소만 써요 */
  var LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  var ENDPOINT = (LOCAL && new URLSearchParams(location.search).get('api')) || CFG.endpoint || '';
  var KEY_TOKEN = 'si-hub-token';   /* 과제 허브와 같은 이름이라, 한쪽에서 로그인하면 다른 쪽도 열려요 */
  var EVERY = 60000;
  var EXAMPLES = [{ title: "Slow Pour", line: "4분, 커피 한 잔을 내리는 시간.", url: "https://sid-kongkong-coffee.vercel.app/", example: true }];
  var grid = document.getElementById('grid'), gate = document.getElementById('gate'), foot = document.getElementById('foot');
  var out = document.getElementById('out'), gateOk = document.getElementById('gateOk'), gateMsg = document.getElementById('gateMsg');
  var token = '', current = [], cards = {}, seen = {}, still = {};
  function el(tag, cls, text){var e=document.createElement(tag); if(cls){e.className=cls;} if(text!=null){e.textContent=text;} return e;}
  function key(u){return String(u||'').trim().replace(/\/+$/,'').toLowerCase();}
  function cannotFrame(u){ try{ return new URL(u).hostname.replace(/^www\./,'') === 'claude.ai'; }catch(e){ return true; } }
  /* 주소에서 올린 곳만 남긴다: sid-site.vercel.app → vercel.app. 앞쪽 이름에는 만든 사람의 아이디가 들어가기도 해서 카드에 내지 않는다 */
  function hostOf(u){ try{ var p = new URL(u).hostname.replace(/^www\./,'').split('.'); var n = (p.length > 2 && p[p.length-1].length === 2 && p[p.length-2].length <= 3) ? 3 : 2; return p.slice(-n).join('.'); }catch(e){ return ''; } }
  function idOf(s){ return s.example ? 'ex:'+key(s.url) : (s.code || key(s.url)); }
  function picOf(s){ return still[key(s.url)] || ''; }
  function sigOf(s){ return [s.code||'', s.title||'', s.line||'', key(s.url), picOf(s), s.example?1:0].join('\u0001'); }

  /* 미리보기: 카드가 화면 가까이 왔을 때만 사이트를 불러온다. 1280×800 크기로 열어 카드 폭에 맞게 줄인다 */
  function fit(shot){var f=shot.querySelector('iframe'); if(f){f.style.transform='scale('+(shot.clientWidth/1280)+')';}}
  function load(shot){
    if(shot.dataset.still || shot.querySelector('iframe')){return;}
    var f = document.createElement('iframe');
    f.src = shot.dataset.url; f.title = shot.dataset.title + ' 미리보기';
    f.setAttribute('tabindex','-1'); f.setAttribute('aria-hidden','true'); f.setAttribute('scrolling','no');
    /* 받아 둔 사본은 이 허브와 같은 곳에 있어서, 허브의 로그인 정보에 닿지 못하게 따로 떼어 연다 */
    f.setAttribute('sandbox', shot.dataset.copy ? 'allow-scripts' : 'allow-scripts allow-same-origin');
    f.setAttribute('referrerpolicy','no-referrer');
    f.addEventListener('load',function(){var w=shot.querySelector('.wait'); if(w){w.remove();} f.className='on';});
    shot.appendChild(f); fit(shot);
  }
  var io = ('IntersectionObserver' in window) ? new IntersectionObserver(function(list){
    list.forEach(function(it){ if(it.isIntersecting){ load(it.target); io.unobserve(it.target); } });
  },{rootMargin:'300px 0px'}) : null;
  function watch(shot){ if(io){io.observe(shot);} else {load(shot);} }
  function unwatch(shot){ if(io){io.unobserve(shot);} }
  window.addEventListener('resize',function(){ Object.keys(cards).forEach(function(k){fit(cards[k].shot);}); });

  function build(s){
    var li = el('li','card'), a = el('a');
    a.href = s.url; a.target = '_blank'; a.rel = 'noopener';
    var shot = el('div','shot'); shot.dataset.url = s.url; shot.dataset.title = s.title || s.code || '';
    var pic = picOf(s);
    if(/^c\//.test(pic)){
      /* 다른 페이지 안에 넣을 수 없는 주소(claude.ai 아티팩트 등)는 받아 둔 사본(c/…)을 미리보기로 연다. 카드를 누르면 원래 주소로 간다 */
      shot.dataset.url = pic; shot.dataset.copy = '1';
      shot.appendChild(el('span','wait','미리보기 불러오는 중'));
    } else if(pic){
      /* 사본이 없으면 찍어 둔 화면을 보여 준다 */
      var img = el('img'); img.src = pic; img.alt = ''; img.loading = 'lazy'; img.decoding = 'async';
      shot.dataset.still = '1'; shot.appendChild(img);
    } else if(cannotFrame(s.url)){
      shot.dataset.still = '1'; shot.appendChild(el('span','wait','미리보기를 넣을 수 없는 주소예요'));
    } else {
      shot.appendChild(el('span','wait','미리보기 불러오는 중'));
    }
    /* 카드 맨 위 줄: 별칭(예시 사이트는 "예시")과 올린 곳 */
    var idx = el('div','idx');
    idx.appendChild(s.example ? el('span','tag','예시') : el('span','no',s.code || ''));
    idx.appendChild(el('span','host',hostOf(s.url)));
    a.appendChild(idx); a.appendChild(shot);
    a.appendChild(el('h2',null,s.title || s.code || ''));
    if(s.line){ a.appendChild(el('p','line',s.line)); }
    li.appendChild(a);
    return {li:li, shot:shot};
  }

  /* 목록대로 카드를 맞춘다. 그대로인 카드는 건드리지 않아서 불러온 미리보기가 다시 열리지 않는다.
     주소·제목·한 줄·그림이 달라졌거나 같은 사람이 다시 냈으면(제출 시각이 달라지면) 그 카드만 새로 만든다 */
  function render(list){
    var want = {};
    list.forEach(function(s){ want[idOf(s)] = true; });
    Object.keys(cards).forEach(function(k){
      if(!want[k]){ unwatch(cards[k].shot); if(cards[k].li.parentNode === grid){ grid.removeChild(cards[k].li); } delete cards[k]; }
    });
    var ref = grid.firstChild;
    list.forEach(function(s){
      var k = idOf(s), c = cards[k], sg = sigOf(s);
      if(!c || c.sig !== sg || (c.t && s.t && c.t !== s.t)){
        var made = build(s);
        if(c && c.li.parentNode === grid){
          unwatch(c.shot);
          if(c.li === ref){ ref = made.li; }
          grid.replaceChild(made.li, c.li);
        }
        c = cards[k] = {li:made.li, shot:made.shot, sig:sg, t:(c && c.t) || ''};
        watch(c.shot);
      }
      if(s.t){ c.t = s.t; }
      if(c.li === ref){ ref = ref.nextSibling; } else { grid.insertBefore(c.li, ref); }
    });
  }

  /* 같은 사람이나 같은 주소가 두 번 들어 있으면 뒤에 온 것 하나만 남긴다(시트에서도 한 번 걸러서 온다) */
  function tidy(list){
    var out=[];
    (list||[]).forEach(function(r){
      var url=String(r.url||'').trim();
      if(!/^https:\/\//i.test(url)){return;}
      out.push({code:String(r.code||'').trim(),title:String(r.title||'').trim(),line:String(r.line||'').trim(),url:url,t:String(r.t||'').trim()});
    });
    var seenCode={}, seenUrl={}, kept=[];
    for(var i=out.length-1;i>=0;i--){
      var s=out[i], k=key(s.url);
      if((s.code && seenCode[s.code]) || seenUrl[k]){continue;}
      if(s.code){seenCode[s.code]=true;} seenUrl[k]=true; kept.unshift(s);
    }
    return kept;
  }

  function call(body){
    return window.fetch(ENDPOINT, {method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)})
      .then(function(r){ if(!r.ok){throw new Error('연결하지 못했어요.');} return r.json(); });
  }
  function forget(){ try{ sessionStorage.removeItem(KEY_TOKEN); localStorage.removeItem(KEY_TOKEN); }catch(e){} }
  function settle(){ document.documentElement.classList.remove('entering'); }
  function show(inside){
    settle(); gate.hidden = inside; grid.hidden = !inside; foot.hidden = !inside; out.hidden = !inside;
  }
  function signOut(msg){
    token = ''; forget(); current = []; seen = {}; still = {}; render([]);
    show(false); gateMsg.textContent = msg || ''; gateOk.disabled = !ENDPOINT;
  }
  /* 목록을 받아 카드에 반영한다. 받지 못하면 보이던 것을 그대로 둔다. 들어갈 수 있었는지를 돌려준다 */
  function take(j){
    if(j.auth === false){ signOut('다시 로그인해 주세요.'); return false; }
    if(!j.ok){ return false; }
    still = {};
    Object.keys(j.shots || {}).forEach(function(u){ if(typeof j.shots[u] === 'string' && (/^shots\//.test(j.shots[u]) || /^c\/[0-9a-f]{16}\/(#[\w-]*)?$/.test(j.shots[u]))){ still[key(u)] = j.shots[u]; } });
    var rows = tidy(j.rows);
    /* 시트가 제목을 다시 읽어 오는 몇 분 동안은 제목 칸이 빈 채로 온다. 그때는 같은 사람·같은 주소로 마지막에 본 제목과 한 줄을 그대로 쓴다 */
    rows.forEach(function(r){
      var k = (r.code||'') + '|' + key(r.url);
      if(r.title){ seen[k] = {title:r.title, line:r.line}; }
      else if(seen[k]){ r.title = seen[k].title; r.line = r.line || seen[k].line; }
    });
    current = EXAMPLES.concat(rows);
    render(current);
    return true;
  }
  var busy = false;
  function refresh(){
    if(busy || document.hidden || !token){return;}
    busy = true;
    call({action:'sites', token:token}).then(take).then(function(){busy=false;}, function(){busy=false;});
  }
  /* pre = 로그인 응답에 같이 실려 온 목록. 있으면 다시 묻지 않는다 */
  function enter(pre){
    return (pre ? Promise.resolve(pre) : call({action:'sites', token:token})).then(function(j){
      if(!take(j)){ if(token){ throw new Error(j.error || '불러오지 못했어요.'); } return; }
      show(true);
    });
  }

  out.addEventListener('click', function(){ signOut(''); });
  gate.addEventListener('submit', function(e){
    e.preventDefault(); if(!ENDPOINT){return;}
    var uid = document.getElementById('uid'), upw = document.getElementById('upw'), keep = document.getElementById('keep').checked;
    gateOk.disabled = true; gateMsg.textContent = '';
    call({action:'login', id:uid.value, pw:upw.value, keep:keep, want:'sites'}).then(function(j){
      if(!j.ok){ throw new Error(j.error || '로그인하지 못했어요.'); }
      token = j.token; upw.value = '';
      try{ (keep ? localStorage : sessionStorage).setItem(KEY_TOKEN, token); }catch(e2){}
      return enter(j.data);
    }).catch(function(err){ if(!gate.hidden){ gateMsg.textContent = (err && err.message) || '연결하지 못했어요.'; } })
      .then(function(){ gateOk.disabled = false; });
  });

  /* 시작: 출입증이 남아 있으면 바로 들어가고, 아니면 로그인 화면 */
  if(!ENDPOINT){ settle(); gateOk.disabled = true; gateMsg.textContent = '저장소가 아직 연결되지 않았어요.'; }
  else {
    try{ token = sessionStorage.getItem(KEY_TOKEN) || localStorage.getItem(KEY_TOKEN) || ''; }catch(e){}
    if(token){
      gateOk.disabled = true;
      enter().catch(function(){ if(token){ gateMsg.textContent = '불러오지 못했어요. 새로 고치거나 다시 로그인해 주세요.'; } }).then(function(){ settle(); gateOk.disabled = false; });
    }
  }
  setInterval(refresh, EVERY);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden){ refresh(); } });
})();
</script>
</body>
</html>
